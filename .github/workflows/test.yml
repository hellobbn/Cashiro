name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the removed "tools" package, which now fails.
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-app-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-app-gradle-
      - name: Unit tests and lint
        run: ./gradlew :app:testStandardDebugUnitTest :app:lintStandardDebug :app:compileFdroidDebugKotlin --continue --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-results
          path: |
            app/build/test-results/testStandardDebugUnitTest/
            app/build/reports/lint-results-standardDebug.html
          retention-days: 7
