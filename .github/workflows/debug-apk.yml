name: Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/[^0-9]*//g')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Debug c$COMMIT_COUNT $VERSION ($CODE) @ $SHORT_SHA"

      - name: Build slim standard debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6G"
        run: |
          ./gradlew assembleStandardDebug --no-configuration-cache --stacktrace \
            -PslimDebug \
            -PgitCommitCount=${{ steps.version.outputs.commit_count }} \
            -PgitSha=${{ steps.version.outputs.short_sha }}

      - name: Stage APKs
        run: |
          SRC="app/build/outputs/apk/standard/debug"
          OUT="dist/debug"
          mkdir -p "$OUT"
          COUNT="${{ steps.version.outputs.commit_count }}"
          SHA="${{ steps.version.outputs.short_sha }}"
          TARGET="$OUT/Cashiro-debug-c${COUNT}-${SHA}-arm64-v8a.apk"
          shopt -s nullglob
          if [[ -f "$SRC/app-standard-arm64-v8a-debug.apk" ]]; then
            cp "$SRC/app-standard-arm64-v8a-debug.apk" "$TARGET"
          elif [[ -f "$SRC/app-standard-debug.apk" ]]; then
            cp "$SRC/app-standard-debug.apk" "$TARGET"
          else
            echo "::error::No debug APK found in $SRC"
            ls -la "$SRC" || true
            exit 1
          fi
          ls -lh "$TARGET"
          (
            cd "$OUT"
            sha256sum *.apk | tee SHA256SUMS
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cashiro-debug-c${{ steps.version.outputs.commit_count }}-${{ steps.version.outputs.short_sha }}
          path: |
            dist/debug/*.apk
            dist/debug/SHA256SUMS
          retention-days: 14

      - name: Drop previous debug assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release view debug-latest --json assets --jq '.assets[].name' | while read -r name; do
              [ -n "$name" ] && gh release delete-asset debug-latest "$name" --yes || true
            done
          fi

      - name: Publish rolling debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug c${{ steps.version.outputs.commit_count }} (${{ steps.version.outputs.short_sha }})
          prerelease: true
          make_latest: false
          files: |
            dist/debug/*.apk
            dist/debug/SHA256SUMS
          body: |
            Sideload debug build from `${{ github.sha }}` on `main`.

            commit_count: ${{ steps.version.outputs.commit_count }}
            commit: ${{ github.sha }}

            - Version: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.code }})
            - Commit count: ${{ steps.version.outputs.commit_count }}
            - ABI: arm64-v8a only
            - Native libs are zip-compressed; debug minify/shrink is on
            - Signed with the Android debug keystore

            Install `Cashiro-debug-c${{ steps.version.outputs.commit_count }}-${{ steps.version.outputs.short_sha }}-arm64-v8a.apk`.
