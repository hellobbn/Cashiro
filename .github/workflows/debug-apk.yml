name: Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/[^0-9]*//g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Debug version $VERSION ($CODE) @ $SHORT_SHA"

      - name: Build standard debug APKs
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6G"
        run: ./gradlew assembleStandardDebug --no-configuration-cache --stacktrace

      - name: Stage APKs
        id: stage
        run: |
          SRC="app/build/outputs/apk/standard/debug"
          OUT="dist/debug"
          mkdir -p "$OUT"
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.version.outputs.short_sha }}"
          shopt -s nullglob
          if [[ -f "$SRC/app-standard-universal-debug.apk" ]]; then
            cp "$SRC/app-standard-universal-debug.apk" "$OUT/Cashiro-debug-v${VERSION}-${SHA}-universal.apk"
          fi
          if [[ -f "$SRC/app-standard-arm64-v8a-debug.apk" ]]; then
            cp "$SRC/app-standard-arm64-v8a-debug.apk" "$OUT/Cashiro-debug-v${VERSION}-${SHA}-arm64-v8a.apk"
          fi
          ls -la "$OUT"
          if ! compgen -G "$OUT/*.apk" > /dev/null; then
            echo "::error::No debug APKs found in $SRC"
            ls -la "$SRC" || true
            exit 1
          fi
          (
            cd "$OUT"
            sha256sum *.apk | tee SHA256SUMS
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cashiro-debug-${{ steps.version.outputs.short_sha }}
          path: |
            dist/debug/*.apk
            dist/debug/SHA256SUMS
          retention-days: 14

      - name: Publish rolling debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug build ${{ steps.version.outputs.version }} (${{ steps.version.outputs.short_sha }})
          prerelease: true
          make_latest: false
          files: |
            dist/debug/*.apk
            dist/debug/SHA256SUMS
          body: |
            Sideload debug build from `${{ github.sha }}` on `main`.

            - Version: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.code }})
            - Commit: ${{ github.sha }}
            - Signed with the Android debug keystore (will not update a release-signed install)

            Install the `arm64-v8a` APK on a physical phone, or the `universal` APK if you are unsure.
